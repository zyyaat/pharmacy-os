version: '3.8'

services:
  # Supabase Database (PostgreSQL 15+)
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supavisor (Connection Pooling on port 6543)
  supavisor:
    image: supabase/supavisor:latest
    ports:
      - "6543:6543"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      PORT: 6543
    depends_on:
      db:
        condition: service_healthy

  # Redis (for development only - NOT for production)
  # Production uses River Queue (Postgres-based)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # NOTE: Redis is only for local dev caching, not for queues or sessions

volumes:
  pgdata:
